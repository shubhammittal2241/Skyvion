<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator EMI</title>
    <link rel="stylesheet" href="calculator.css" />
  </head>
  <body>
    <div class="box">
      <h1 id="head">Skyvion EMI Calculator</h1>

      <div class="calculator">
        <div id="left">
          <div class="input-wrapper">
            <div class="label-row">
              <label>Loan Amount (₹)</label>
              <input type="number" id="amountInput" value="5000000" />
            </div>
            <input
              type="range"
              id="amountRange"
              min="100000"
              max="10000000"
              step="50000"
              value="5000000"
            />
          </div>

          <div class="input-wrapper">
            <div class="label-row">
              <label>Interest Rate (%)</label>
              <input type="number" id="rateInput" value="8.5" />
            </div>
            <input
              type="range"
              id="rateRange"
              min="4"
              max="18"
              step="0.1"
              value="8.5"
            />
          </div>

          <div class="input-wrapper">
            <div class="label-row">
              <label>Tenure (Years)</label>
              <input type="number" id="tenureInput" value="20" />
            </div>
            <input
              type="range"
              id="tenureRange"
              min="1"
              max="30"
              step="1"
              value="20"
            />
          </div>
        </div>

        <div id="right">
          <div class="result-title">Your Monthly EMI</div>
          <div class="emi-value" id="emiDisplay">₹ <span id="monthlyemi">0</span></div>

          <div class="summary-item">
            Total Interest: <span id="totalInterest">0</span>
          </div>
          <div class="summary-item">
            Total Amount: <span id="totalAmount">0</span>
          </div>

          

          <button id="apply-btn">Apply Now</button>
        </div>
      </div>
      <div class="logo"><img src="assets/logo.png" alt="Skyvion Logo" /></div>
    </div>
    <script src="calculator.js"></script>
  </body>
</html>
